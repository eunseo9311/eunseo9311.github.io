<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ site.title }}{% elsif page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% assign desc = page.description | default: site.description %}
    <meta name="description" content="{{ desc | escape }}">
    <meta name="author" content="{{ site.author | escape }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans+TC|Open+Sans|Roboto&amp;display=swap">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if site.favicon %}
        <link rel="icon" href="{{ site.favicon | relative_url }}">
    {% endif %}
    <meta property="og:description" content="{{ desc | escape }}">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    {% if site.og_image %}
        <meta property="og:image" content="{{ site.og_image | absolute_url }}">
    {% endif %}
</head>
<body>
    <div class="wrapper">
        <div class="navbar container">
            <a id="author-name" class="alignable pull-left" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <ul id="navlist" class="alignable pull-right navbar-ul">
                {% for item in site.nav %}
                    <li class="alignable pull-left nav-list">
                        <a href="{{ item.link | relative_url }}">{{ item.name }}</a>{% unless forloop.last %} /{% endunless %}
                    </li>
                {% endfor %}
            </ul>
        </div>
        <div style="clear:both"></div>
        <hr>
        <div class="container content">
            {{ content }}
        </div>
    </div>
</body>
</html>
