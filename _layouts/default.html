<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% assign desc = page.description | default: site.description %}
    <meta name="description" content="{{ desc | escape }}">
    <meta name="author" content="{{ site.author | escape }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&amp;display=swap">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
    {% if site.favicon %}
        <link rel="icon" href="{{ site.favicon | relative_url }}">
    {% endif %}
    <meta property="og:description" content="{{ desc | escape }}">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    {% if site.og_image %}
        <meta property="og:image" content="{{ site.og_image | absolute_url }}">
    {% endif %}
</head>
<body>
    <div class="wrapper">
        <header class="site-header container">
            <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Eunseo Song home">{{ site.title }}</a>
        </header>
        <main class="container content">
            {{ content }}
        </main>
    </div>
</body>
</html>
